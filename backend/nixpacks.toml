[phases.setup]
nixPkgs = ["python312"]

[phases.install]
cmds = ["pip install -r requirements.txt"]

# Keep this identical to the Procfile: Railway may use either, and only a
# command that runs `flask db upgrade` will migrate the database on deploy.
[start]
cmd = "python scripts/setup_docs.py; flask db upgrade && gunicorn -c gunicorn_config.py 'app:create_app()'"
